name: Blue-Green Deployment to Firebase Hosting

# CONFIGURATION REQUISE:
# Dans GitHub: Settings → Secrets and variables → Actions
# Ajouter le secret: FIREBASE_SERVICE_ACCOUNT_AUTH_ECOMMMERCE
# Obtenir la clé via: firebase init hosting:github

on:
  push:
    branches:
      - main
      - features/product

jobs:
  # Étape 1: Build et tests
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.3'
        channel: 'stable'
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Check formatting
      run: flutter format --set-exit-if-changed .
      
    - name: Analyze code
      run: flutter analyze
      
    - name: Run tests with coverage
      run: flutter test --coverage
      
    - name: Check coverage threshold
      run: |
        # Install lcov for coverage analysis
        sudo apt-get update && sudo apt-get install -y lcov
        
        # Check if coverage file exists
        if [ ! -f "coverage/lcov.info" ]; then
          echo "❌ No coverage file found"
          exit 1
        fi
        
        # Generate coverage report
        genhtml coverage/lcov.info -o coverage/html
        
        # Extract coverage percentage (simpler approach)
        COVERAGE=$(lcov --summary coverage/lcov.info 2>/dev/null | grep "lines" | grep -o '[0-9.]*%' | head -1 | sed 's/%//')
        
        if [ -z "$COVERAGE" ]; then
          echo "❌ Could not extract coverage percentage"
          exit 1
        fi
        
        echo "Coverage: ${COVERAGE}%"
        
        # Compare coverage (using awk instead of bc)
        if awk -v cov="$COVERAGE" 'BEGIN { exit (cov < 50) }'; then
          echo "✅ Coverage ${COVERAGE}% meets 50% threshold"
        else
          echo "❌ Coverage ${COVERAGE}% is below 50% threshold"
          exit 1
        fi
      
    - name: Build web
      run: flutter build web --release --web-renderer html
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: web-build
        path: build/web

  # Étape 2: Déploiement Blue (Preview)
  deploy-blue:
    needs: build-and-test
    runs-on: ubuntu-latest
    outputs:
      preview-url: ${{ steps.deploy.outputs.details_url }}
    steps:
    - uses: actions/checkout@v4
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: web-build
        path: build/web
        
    - name: Deploy to Blue (Preview Channel)
      id: deploy
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: ${{ secrets.GITHUB_TOKEN }}
        firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUTH_ECOMMMERCE }}
        channelId: blue
        projectId: auth-ecommmerce
        expires: 30d
      env:
        FIREBASE_CLI_EXPERIMENTS: webframeworks

  # Étape 3: Smoke Tests sur Blue
  smoke-tests:
    needs: deploy-blue
    runs-on: ubuntu-latest
    steps:
    - name: Run Smoke Tests
      run: |
        echo "🧪 Running smoke tests on: ${{ needs.deploy-blue.outputs.preview-url }}"
        # Ajouter vos tests d'intégration ici
        curl -f ${{ needs.deploy-blue.outputs.preview-url }} || exit 1
        echo "✅ Smoke tests passed!"

  # Étape 4: Promotion vers Green (Live) - Manuel pour sécurité
  promote-to-green:
    needs: [deploy-blue, smoke-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: web-build
        path: build/web
        
    - name: Deploy to Green (Live Channel)
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: ${{ secrets.GITHUB_TOKEN }}
        firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUTH_ECOMMMERCE }}
        channelId: live
        projectId: auth-ecommmerce
      env:
        FIREBASE_CLI_EXPERIMENTS: webframeworks
        
    - name: Notify Success
      run: |
        echo "🚀 Successfully deployed to production!"
        echo "🌐 Live URL: https://auth-ecommmerce.web.app/"