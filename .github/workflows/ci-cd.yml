name: CI/CD Flutter Web

on:
  push:
    branches: [ main, features/product ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: 🧪 Tests & Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: ☕ Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: 🎯 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.3'
        channel: 'stable'
        cache: true
        
    - name: 📦 Get dependencies
      run: flutter pub get
      
    - name: 🎨 Check formatting
      run: dart format --set-exit-if-changed .
      
    - name: 📊 Analyze code
      run: flutter analyze --no-fatal-infos || true
      
    - name: 🧪 Run tests with coverage
      run: flutter test --coverage
      
    - name: 📈 Check coverage threshold
      run: |
        # Install lcov for coverage analysis
        sudo apt-get update -qq -y
        sudo apt-get install -qq -y lcov
        
        # Generate coverage report
        genhtml coverage/lcov.info -o coverage/html
        
        # Calculate coverage percentage
        COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep "lines......" | cut -d' ' -f4 | cut -d'%' -f1)
        echo "Coverage: $COVERAGE%"
        
        # Check if coverage is >= 5%  
        if (( $(echo "$COVERAGE >= 5" | bc -l) )); then
          echo "✅ Coverage $COVERAGE% meets minimum requirement (5%)"
        else
          echo "❌ Coverage $COVERAGE% is below minimum requirement (5%)"
          exit 1
        fi
      
    - name: 📊 Upload coverage to codecov
      uses: codecov/codecov-action@v4
      with:
        file: coverage/lcov.info
        fail_ci_if_error: false

  build:
    name: 🏗️ Build Web
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: ☕ Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: 🎯 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.3'
        channel: 'stable'
        cache: true
        
    - name: 📦 Get dependencies
      run: flutter pub get
      
    - name: 🏗️ Build Web
      run: flutter build web --release --web-renderer html
      
    - name: 📦 Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: web-build
        path: build/web/
        retention-days: 30
        
    - name: 📊 Build info
      run: |
        echo "🎉 Build completed successfully!"
        echo "📁 Build size: $(du -sh build/web | cut -f1)"
        echo "📄 Files count: $(find build/web -type f | wc -l)"

  deploy-preview:
    name: 🚀 Deploy Preview
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 📦 Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: web-build
        path: build/web/
        
    - name: 🚀 Deploy to Firebase Hosting (Preview)
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: '${{ secrets.GITHUB_TOKEN }}'
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
        projectId: 'flutter-shop-mds'
        expires: 30d
        
  deploy-production:
    name: 🌟 Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://flutter-shop-mds.web.app
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 📦 Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: web-build
        path: build/web/
        
    - name: 🚀 Deploy to Firebase Hosting (Production)
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: '${{ secrets.GITHUB_TOKEN }}'
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
        projectId: 'flutter-shop-mds'
        channelId: live
