<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutter_shop">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SHOPIFUN - Boutique en ligne</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- PWA Meta tags -->
  <meta name="theme-color" content="#4CAF50">
  <meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  
  <!-- Service Worker pour PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js')
          .then(function(registration) {
            console.log('Service Worker enregistré avec succès:', registration.scope);
          }, function(err) {
            console.log('Échec enregistrement Service Worker:', err);
          });
      });
    }
  </script>
  
  <!-- PWA Install prompt -->
  <script>
    let deferredPrompt;
    
    window.addEventListener('beforeinstallprompt', (e) => {
      console.log('🎉 PWA installable détectée!');
      e.preventDefault();
      deferredPrompt = e;
      
      // Stocker globalement pour Flutter
      window.pwaInstallPrompt = e;
      
      // Déclencher un événement personnalisé
      window.dispatchEvent(new CustomEvent('pwa-installable', {
        detail: { canInstall: true }
      }));
    });

    window.addEventListener('appinstalled', (evt) => {
      console.log('🎉 PWA installée avec succès!');
      deferredPrompt = null;
      window.pwaInstallPrompt = null;
    });

    // Fonction globale pour installer la PWA
    window.installPWA = function() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        return deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('Utilisateur a accepté l\'installation');
            deferredPrompt = null;
            return true;
          } else {
            console.log('Utilisateur a refusé l\'installation');
            return false;
          }
        });
      }
      return Promise.resolve(false);
    };
  </script>
</body>
</html>
